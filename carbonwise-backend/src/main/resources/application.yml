server:
  port: ${PORT:8080}

spring:
  application:
    name: carbonwise-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:carbonwisedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:carbonwise-secret-key-change-in-production-super-long-string}
  expiration: 86400000
  refresh-expiration: 604800000

mqtt:
  broker: ${MQTT_BROKER:tcp://localhost:1883}
  client-id: carbonwise-backend
  topic-prefix: carbonwise/

ai:
  server-url: ${AI_SERVER_URL:http://localhost:5000}

logging:
  level:
    com.carbonwise: DEBUG
    org.springframework.security: DEBUG
