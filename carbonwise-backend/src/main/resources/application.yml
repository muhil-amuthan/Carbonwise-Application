server:
  port: 8080

spring:
  application:
    name: carbonwise-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/carbonwise
    username: carbonwise
    password: ""
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:carbonwise-secret-key-change-in-production}
  expiration: 86400000
  refresh-expiration: 604800000

mqtt:
  broker: tcp://localhost:1883
  client-id: carbonwise-backend
  topic-prefix: carbonwise/

ai:
  server-url: http://localhost:5000

logging:
  level:
    com.carbonwise: DEBUG
    org.springframework.security: DEBUG