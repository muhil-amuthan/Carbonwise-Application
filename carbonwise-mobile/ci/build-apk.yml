# ============================================================================
# CarbonWise - GitHub Actions workflow to build the Android release APK
# AND auto-publish CarbonWise.apk to a GitHub Release.
# ----------------------------------------------------------------------------
# This file lives OUTSIDE `.github/workflows/` on purpose: the Arena agent's
# GitHub token does not have the `workflows` permission, so it cannot create
# files under `.github/workflows/` itself.
#
# TO ACTIVATE (one-time, by the repo owner) - Option A (web UI, phone OK):
#   1. Open .github/workflows/build_apk.yml on github.com in your repo.
#   2. Tap Edit, replace the whole file with the content below the line,
#      commit to main. Done - every push to main builds AND releases the APK.
#
# TO ACTIVATE (git CLI):
#   cp carbonwise-mobile/ci/build-apk.yml .github/workflows/build-apk.yml
#   git add .github/workflows/build-apk.yml
#   git commit -m "ci: auto-publish CarbonWise.apk to Release"
#   git push
#
# After that, every push builds the APK and attaches CarbonWise.apk to the
# "carbonwise-demo-v1" Release. Download it from the repo's Releases page.
# ============================================================================
# ============================ FILE CONTENT BELOW ============================
name: Build Android APK

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Get Dependencies
        run: |
          cd carbonwise-mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd carbonwise-mobile
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarbonWise-App-Release
          path: carbonwise-mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish CarbonWise.apk to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp carbonwise-mobile/build/app/outputs/flutter-apk/app-release.apk CarbonWise.apk
          ls -lh CarbonWise.apk
          TAG="carbonwise-demo-v1"
          NOTES="CarbonWise Industrial demo APK. Install on Android, open the app, and tap One-Tap Demo / Guest Access. Guest mode uses clearly-labeled demo data; no live backend, hardware, or maps key required."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CarbonWise.apk --clobber
          else
            gh release create "$TAG" CarbonWise.apk --target "${{ github.sha }}" --title "CarbonWise Android APK (Demo)" --notes "$NOTES"
          fi
