name: carbonwise
description: CarbonWise - AI Carbon Intelligence Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  lottie: ^2.7.0

  # Google Maps
  google_maps_flutter: ^2.5.3

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.0.3

  # Authentication
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  firebase_storage: ^11.6.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Maps & Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.12.0

  # MQTT
  mqtt_client: ^4.0.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.2
  connectivity_plus: ^5.0.2
  cached_network_image: ^3.3.1
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
